bucharest_core_platform:
  header: 2026 Core Platform - Bucharest Release
  subheader: Expanded Detailed Feature Structure
  sections:
    -
      header: Broadcast Transformation
      accordions:
        -
          title: Performance and Scale
          items:
            -
              title: Fabric Core Protocol Transport Architecture
              description: |
                Fabric Core Protocol Transport Architecture
                A decentralized, high-density multipoint routing architecture designed to replicate satellite-style one-to-many distribution without centralized infrastructure dependencies.

                <div style="height: 1em"></div>

                Key characteristics:
                - any-to-any routing topology
                - decentralized control plane
                - no centralized origin bottlenecks
                - high fan-out distribution without traffic duplication
                - global routing graph optimized for deterministic latency
                - endpoints within approximately 50 ms network proximity
                - minimal packet loss compensation requirements
                - terrestrial routing optimized to avoid cloud data center hairpin routing
                - distributed content fabric nodes acting as routing relay points
            -
              title: Supported Input Protocols
              description: |
                Supported Input Protocols
                Transport ingest formats:
                  - MPEG Transport Stream (TS)
                  - RTP TS encapsulation
                  - SRT TS transport
                  - UDP TS transport
                  - multicast TS
                  - unicast TS
                Preserved timing features:
                  - arrival timestamp preservation
                  - RTP timestamp preservation
                  - continuity counter preservation
                  - clock drift detection capability
            -
              title: Supported Encoding Formats
              description: |
                Video encoding:
                - H264 / AVC
                - H265 / HEVC
                - JPEG XS mezzanine compression
                - raw TS passthrough
                
                Encoding characteristics:
                - broadcast mezzanine quality support
                - high bitrate mezzanine ingest compatibility
                - low latency encoder alignment support
            -
              title: Fabric Internal Packaging Formats
              description: |
                Supported packaging representations:
                - TS with timing metadata
                - RTP encapsulated TS
                - fragmented MP4 (FMP4)
                - CMAF aligned packaging
                - hybrid TS + FMP4 dual packaging pipelines
                
                <div style="height: 1em"></div>
                
                Packaging behaviors:
                - preservation of packet level timing fidelity
                - consistent segment boundary alignment
                - deterministic fragment structure
            -
              title: Output Protocols
              description: |
                Supported output transport types:
                broadcast outputs:
                - SRT push
                - SRT pull
                - RTP push
                - RTP pull
                - UDP TS push
                - multicast TS delivery
                
                <div style="height: 1em"></div>
                
                OTT outputs:
                - FMP4 segment generation
                - HLS manifest generation
                - DASH MPD manifest generation
                
                <div style="height: 1em"></div>
                
                output targeting options:
                - per receiver output definition
                - per geographic region routing
                - per node routing resolution
                - dynamically resolved global endpoint URLs
                - output replication across redundant paths
            -
              title: Transcoding and Transformation Capabilities
              description: |
                JPEG XS workflows:
                - JPEG XS resolution downscale
                - JPEG XS bitrate reduction
                - JPEG XS → H264 transcode
                - JPEG XS → H265 transcode
                
                <div style="height: 1em"></div>
                
                H264 / H265 workflows:
                - bitrate ladder generation
                - spatial resolution rescale
                - GOP structure normalization
                - encoding profile alignment
                
                <div style="height: 1em"></div>
                
                Packaging transformations:
                - TS → FMP4 conversion
                - TS → CMAF segmentation
                - CMAF fragment alignment for adaptive bitrate streaming
                
                <div style="height: 1em"></div>
                
                Zero-copy transformation:
                - avoids intermediate file materialization
                operates on Fabric object parts directly
            -
              title: Latency Engineering
              description: |
                glass-to-glass latency targets:
                - sub 500 milliseconds globally

                <div style="height: 1em"></div>

                latency optimization strategies:
                - minimized buffer depth
                - short segment duration CMAF chunks
                - parallelized fragment generation
                - optimized routing path selection
                - minimized serialization delays

                <div style="height: 1em"></div>

                supports:
                - real time sports production workflows
                - interactive streaming environments
                - synchronized global distribution events
            -
              title: Jitter Mitigation and Clock Drift Compensation
              description: |
                sub millisecond jitter smoothing:

                <div style="height: 1em"></div>

                metrics:
                - inter-arrival time (IAT)
                - RTP timestamp variance
                - TS continuity consistency

                <div style="height: 1em"></div>

                correction algorithms:
                - drift compensation
                - timestamp interpolation
                - jitter buffer smoothing
                - reset event reconciliation
                - RTP clock skew compensation
            -
              title: Recording and Persistence
              description: |
                zero copy recording architecture:

                <div style="height: 1em"></div>

                recording outputs:
                - TS time indexed storage
                - FMP4 mezzanine generation
                - live stream archival
                - live to VoD transformation

                <div style="height: 1em"></div>

                download support:
                - full asset export
                - mezzanine export
                - ISO download workflows
                - B2B asset delivery

                <div style="height: 1em"></div>

                archive features:
                - timecode continuity preservation
                - frame accurate persistence
            -
              title: Multipath Redundant Routing
              description: |
                global multipath routing architecture:

                <div style="height: 1em"></div>

                characteristics:
                - disjoint routing graph
                - independent route calculation
                - no shared routing elements across redundant paths
                - route diversity enforcement

                <div style="height: 1em"></div>

                failure resilience:
                - link level redundancy
                - node level redundancy
                - path level redundancy
            -
              title: SMPTE 2022-7 Distributed Phase Lock
              description: |
                supports A/B redundant stream synchronization:

                <div style="height: 1em"></div>

                features:
                  - decentralized synchronization logic
                  - automatic phase alignment
                  - sub millisecond stream alignment
                  - no master timing node required
                  - geographic independence of synchronization
    

        -
          title: A/V Features
          items:
            -
