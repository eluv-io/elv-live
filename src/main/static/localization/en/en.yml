    creator_studio:
      header: Content Fabric Application Suite
      title: Creator Studio
      short_description: |
        Easily manage, distribute, and sell media assets in the Fabric to
        <br>
        consumers or business partners via automatic streaming properties.
      full_description: |
        With the <span style="color: var(--color-highlight-3)">**Creator Studio**</span> app, publishers and brands can easily manage, distribute, authorize and sell media in the Content Fabric, to consumers or business partners, for streaming, download, and/or discovery.  The app combines simple, fast management of Fabric-hosted content; easy creation of branded media property sites via automatic web UIs with rich and modern UX; and built-in media selling including subscription, per event/pay per view, and enterprise access control options. Properties for live sports streaming, premium VoD movies and TV, and video archive services can be stood up quickly and configured with ease.
        
        The app takes advantage of the Content Fabric’s efficient architecture where one source content object renders all versions and variants, and uses its data-driven just-in-time authorization and serving. Media items (i.e. live video, on demand video, HTML apps, images, galleries, etc.) and collections can be independently presented and recombined in any number of Property sites. Tags and attributes can be assigned for dynamic loading of authorized/filtered media views in Property pages without writing code.  The app automatically loads media from the Fabric and includes a visual builder for configuring Property pages. Properties integrate the Eluvio Embeddable Player and  Eluvio Media Wallet out of the box providing a “no code needed” UI.  As content objects, Properties can also serve as backends for 3rd party media distribution apps via Content Fabric.
      accordion_sections:
        - header: Key Features
          items:
            - title: Manage Content
              description: |
                - Manage any media item in the Fabric (live video, on demand video, HTML apps, images, galleries, albums, ebooks, etc.) in an intuitive and visual UI
                - Configure thumbnails, metadata, and associated assets per item
                - Configure media lists, collections, and media catalogs for grouping in Property pages
                - Assign tags and attributes for dynamic loading, search and filter in Property pages
            - title: Create and Publish No Code Media Properties
              description: |
                - Build Media Property sites comprised of any media content using section, page, and subproperty visual builder
                - Re-use media items, lists and collections across any number of properties
                - Configure Property branding and metadata including headers, logos, and sectional and item metadata with static and automatic options
                - Configure live matches and events including pre and post-event slates and countdowns.
                - Configure tags and attributes for group, filter, and advanced search views
                - Configure integrated Media Wallet with custom CSS and branding
                - Assign a custom vanity URL or use built in URLs for Property hosting
            - title: Sell and Authorize Content
              description: |
                - For Enterprise / BtoB Properties, configure item SKUs for proof of authorization with on chain minting
            - title: Preview, Stream, Download, Discovery
              description: |
                - For Consumer Properties, configure item SKUs for media sell through: per-transaction, subscription, and free claim with on chain minting and proof-of-purchase/ownership
                - Configure prices, currencies, and method of payment for integrated checkout and sales
                - Configure Property item authorization policies for open (public) access, soft paywalls, and proof-of-ownership access
    analytics:
      header: Content Fabric Application Suite
      title: Analytics & Reporting
      short_description: |
        Analyze Viewership, Streaming QoS, Sales & Revenue
      full_description: |
        Understand how your content performs—from every stream and viewer session to every purchase and transaction.
        
        Eluvio Content Analytics & Reporting provides comprehensive real-time and historical intelligence across Content Fabric streaming and monetization. Track audience engagement, streaming quality of service (QoS), individual viewer sessions, segment delivery performance, product sales, and revenue from a unified analytics environment.
        
        Analyze performance across your entire Content Fabric tenancy or drill down from a title, live stream, product, country, or device all the way to an individual streaming session or sales transaction. Reporting data remains tenant-secured and private, encrypted using tenant keys and accessible only with authorized tenant credentials.
      accordion_sections:
        - header: Key Features
          items:
            - title: Audience & Viewership Analytics
              subtitle: Dashboard for Viewership and QoS Stats by Top Titles and Live Streams
              description: |
                Get a real-time and historical view of audience activity across all streamed content in your Content Fabric tenancy.
                - Track sessions, unique viewers, and total playout time
                - Continuous time-series viewership analysis
                - Analyze the past hour, 24 hours, 7 days, 30 days, or past year
                - Break down viewing by streaming segment resolution
                - Identify top-performing titles and live streams
                - Compare sessions, unique viewers, and total playout time across content
                - Filter viewership history by individual title or live stream
                
                The Dashboard provides a consolidated view of audience activity and streaming performance, including peak sessions, latency, segment latency distributions, and top content.
            - title: Streaming QoS & Segment Delivery Analytics
              subtitle: Measure End-to-End Delivery Performance From the Fabric
              description: |
                View detailed Content Fabric delivery metrics for streaming sessions.
                
                - Measure 99th percentile, average, maximum, and minimum segment delivery times
                - Analyze delivery performance for individual streams or in aggregate
                - Correlate QoS with titles, viewers, geography, devices, and serving nodes
                - Inspect playout duration, bitrate distribution, and streaming errors
                - Analyze segment delivery performance for selected viewer sessions
                - Compare streaming quality across content and configurations
                
                This makes it possible to move directly from a global QoS metric to the precise stream, viewer session, device, Fabric node, and content configuration associated with that performance.
            - title: Multidimensional Streaming Metrics
              subtitle: Analyze Individual Streaming Sessions
              description: |
                View and filter streaming metrics across multiple dimensions simultaneously to understand exactly what was streamed, to whom, where, on what device, and from which Fabric infrastructure.
              sub_items:
                - title: Stream Metadata
                  description: |
                    - Content Object ID
                    - Content Object Version Hash
                    - Title
                    - Program duration
                    - DRM type
                    - Playout resolution
                - title: Viewer Geography
                  description: |
                    - Client country
                    - Client city
                - title: Viewer Session & Authorization
                  description: |
                    - User authorization address
                    - Wallet address or Ticket ID
                    - Session ID
                - title: Fabric Infrastructure
                  description: |
                    - Fabric serving node
                - title: Browser & Device
                  description: |
                    - Browser and version
                    - Operating system and version
                    - Device name and model
            - title: Individual Session Analytics
              subtitle: From Global Audience Metrics to a Single Viewer Session
              description: |
                Drill down from aggregate viewership directly into an individual streaming session.
                View all sessions over a selected date range and inspect:
                - Title and timestamp
                - Operating system and browser
                - Session duration
                - Session ID
                - Client authorization address
                - Detailed content metadata
                - Viewer geographic information
                - Authorization ID
                - Fabric serving node
                - User agent and device information
                - Session status
                - Playout duration
                - Bitrate distribution
                - Streaming errors
                
                This provides end-to-end visibility from the Content Fabric through to the individual playback session—making the same analytics environment useful for audience analysis, operations, customer support, and QoS troubleshooting.
            - title: Sales Analytics & Reporting
              subtitle: Understand What Sells, Where It Sells, and How Revenue Is Generated
              description: |
                Track comprehensive metrics for product sales and revenue by territory, product type, buyer, and payment method.
                The Sales Analytics dashboard provides an aggregate view across purchases while supporting drilldown into individual transactions.
                
                Analyze Sales by Product, Country & Payment Processor
                - Group and filter sales by country
                - Analyze by product or entitlement
                - Analyze by payment processor, including Stripe, Apple Pay, and other payment methods
                - Identify top-selling products
                - Identify leading purchasing countries
                - Compare product and geographic sales performance
                - Filter sales volumes across multiple dimensions
                - Export results as CSV
            - title: Individual Sales & Transaction Drilldown
              subtitle: Move from aggregate revenue directly into individual purchases.
              description: |
                Analyze transactions by:
                - Date range
                - Transaction ID
                - Buyer wallet address
                - Payment processor
                - Buyer email
                - Currency
                - Seller address
                - Purchase geography
                - Product SKU
                - Item purchased
                - Payment details
                - Royalty details
                
                The result is a unified view of what was purchased, by whom, where, through which payment method, and how the resulting payment and royalty were processed.
            - title: Revenue Reporting
              subtitle: Complete Visibility Into Transactions & Revenue
              description: |
                Content Fabric Revenue Reporting provides a consolidated operational and financial view of monetization activity.
                
                The Transactions page includes:
                - Overall sales
                - Total transaction counts
                - Transaction-status overview
                - Payment processor reporting
                - Detailed table of individual transactions
                - Product-level sales
                - Transaction-level detail
            - title: Connect Streaming Performance Directly to Business Performance
              description: |
                Content Fabric Analytics & Reporting brings together information traditionally scattered across CDN analytics, player telemetry, audience measurement systems, commerce platforms, and payment reporting.

                Start with overall viewership or revenue and progressively drill down:
                
                  Tenancy → Title / Live Stream → Audience → Geography → Device → Session → QoS
                  or
                  Revenue → Product → Country → Payment Processor → Buyer → Individual Transaction
                  
                  
                  Because streaming, authorization, content metadata, and monetization operate within the Content Fabric, analytics can correlate these dimensions without requiring separate media-delivery and commerce reporting systems.
                  
                  The result is a unified operational and business intelligence layer for understanding what audiences are watching, how well it is being delivered, what they are buying, and how that activity translates into revenue.
                  
                  **Tenant-Secured and Private**
                  All Fabric reporting data is encrypted for the tenant using tenant keys and is authorized for viewing only with valid tenant credentials—keeping audience, operational, and sales intelligence private to the tenant.

    video_intelligence_services:
      header: Content Fabric Application Suite
      title: Eluvio Video Intelligence Services
      short_description: |
        Open Model Frame-Accurate, Multimodal AI — Inline Live and On-Demand Video, with Zero File Copies or Egress
      full_description: |
        The <span style="color: var(--color-highlight-3)">**Eluvio Video Intelligence Services**</span> provide a universal, open-model AI architecture for analyzing, understanding, searching, and transforming live and on-demand video directly within the Content Fabric. AI inference operates inline with the Fabric media pipeline and with frame accuracy across <span style="color: var(--color-highlight-3)">**video, audio, text, images, motion, pose, and telemetry**</span>, creating multimodal intelligence precisely synchronized to the source media.
        
        Unlike conventional video AI workflows that require media to be copied to separate AI infrastructure, analyzed, stored, and frequently re-transcoded, Eluvio AI operates directly against Content Fabric media. Model outputs—including labels, transcripts, descriptions, embeddings, vectors, identities, and other metadata—are written directly into the Fabric and immediately available for search, personalization, generation, and delivery. There are <span style="color: var(--color-highlight-3)">**zero file copies, zero media or metadata movement, and zero unnecessary re-transcoding or egress**</span> across the workflow.

        The Eluvio AI Runtime provides an open inference environment for frame-level, video-level, multimodal, and language models. It includes <span style="color: var(--color-highlight-3)">**17 built-in AI models and processors**</span> spanning multimodal analysis, segmentation, summarization, transcription, identification, search, and generation, with an extensible API for incorporating Eluvio-developed, open-source, customer-specific, and third-party models.
        
        Models can operate against individual or sampled frames, segments, shots, beats, scenes, or complete videos. Because intelligence is generated directly against the underlying media timeline, outputs from different models and modalities remain frame-accurately aligned and can be combined to understand exactly <span style="color: var(--color-highlight-3)">**who or what appears, what is happening, what is being said, and where and when it occurs in the video**</span>.
        
        The Fabric’s integrated <span style="color: var(--color-highlight-3)">**fast text, tag, and vector storage and multimodal Search**</span> make this intelligence immediately searchable across individual videos, titles, live events, collections, or entire content libraries. Users and applications can search using natural language, text, images, visual regions, music and audio, transcripts, metadata, and multimodal embeddings to identify precise matching frames, shots, scenes, moments, and clips.
        
        Most importantly, AI intelligence is <span style="color: var(--color-highlight-3)">**directly actionable against the video**</span>. Intelligence associated with a frame, shot, beat, scene, player, speaker, segment, title, or event can immediately drive the Content Fabric’s just-in-time media pipeline for clipping, composition, personalization, transformation, and delivery.

      accordion_sections:
        - header: Key Features
          items:
            - title: Frame-Accurate, Multimodal Video Intelligence
              description: |
                - AI inference across **video, audio, text, images, motion, pose, and multidimensional telemetry**
                - Frame- and segment-level intelligence synchronized directly to the source media timeline
                - Combine intelligence from multiple models and modalities with frame accuracy
                - Analyze individual frames, sampled frames, shots, beats, scenes, segments, or complete videos
                - Real-time inline inference for both live and on-demand video
                - No secondary metadata synchronization or alignment required

            - title: Open-Model AI Runtime
              description: |
                - **17 built-in AI models and processors** for analysis, segmentation, summarization, transcription, identification, search, and generation
                - Open runtime for frame-level, video-level, multimodal, and language models
                - Run **Eluvio-developed, open-source, customer-specific, and third-party models**
                - Extensible Runtime API for continuously incorporating new models
                - Run AI directly against Content Fabric media without exporting or copying source files
                - Select, run, and manage models and processors through the **EVIE AI Runtime**

            - title: Multimodal Analysis & Understanding
              description: |
                - Shot, beat, and scene segmentation
                - Multimodal video and scene understanding
                - Image, video, audio, text, and pose embeddings
                - Multi-language speech-to-text with time-aligned transcripts
                - Speaker detection and identification
                - Celebrity, talent, and player identification
                - Object, brand, and logo recognition
                - OCR and on-screen text intelligence
                - Motion, activity, focus, and pose analysis
                - Topics, moods, themes, and semantic intelligence

            - title: Summarization & Synopsis Generation
              description: |
                - **AI-generated summaries and synopses** for live and on-demand video
                - Generate summaries at the segment, scene, title, or complete event level
                - **“In This Video” key-moment identification**** automatically identifies important moments within a title, event, segment, or scene
                - Personalized synopses configurable by **purpose, audience, length, and style**
                - Automatically generate **chapters, chapter labels, and descriptions** using shot, beat, scene, topic, mood, and semantic intelligence
                - Combine **video, audio, transcript, speaker, identity, and semantic intelligence** for context-aware descriptions
                - Generate topics, themes, key moments, and structured summaries alongside narrative synopses
                - Results remain synchronized to the media for immediate **search, navigation, personalization, highlights, and composition**
                - Generate intelligence without copying or moving the underlying source video

            - title: Fast Text, Tag & Multimodal Search
              description: |
                - Model outputs, tags, embeddings, vectors, transcripts, and metadata stored directly in the Content Fabric
                - Fast **text, tag, semantic, and vector retrieval**
                - Search individual titles, events, collections, or entire video libraries
                - Deep multimodal search by **natural-language prompt, keyword, text, image, music, metadata, or selected visual region**
                - Search across AI-generated intelligence and third-party or proprietary metadata
                - Identify precise matching **frames, shots, scenes, moments, and clips**
                - Combine sports play-by-play, statistics, telemetry, and other external data with AI intelligence
                - Fine-grained Content Fabric authorization applied to search and results


            - title: Live Video Intelligence
              description: |
                - AI inference operates inline as live content is published
                - Frame-accurate intelligence written back to the Fabric in real time
                - Analyze **live sports, broadcasts, and events** using the same architecture as on-demand libraries
                - Combine AI with **play-by-play, player and ball tracking, audio intelligence, telemetry, and existing metadata**
                - Identify and compose live and on-demand highlights
                - Automatically identify key moments as events unfold

            - title: AI-Driven Just-in-Time Media & Compositions — Highlights, Trailers, Reels & Compliance
              description: |
                Turn frame-accurate, multimodal AI intelligence directly into finished media experiences. AI and metadata are immediately actionable against source video to **dynamically drive clipping, composition, personalization, transformation, and delivery**.
                
                - Automatically create personalized **highlights, trailers, reels, shorts, social clips, chapter reels, and compliance reels**
                - Combine **play-by-play, player and ball tracking, transcripts, audio intelligence, identities, topics, scenes, and other metadata** to identify and assemble relevant moments
                - Generate compositions from precise **frames, shots, beats, scenes, segments, players, speakers, and events**
                - Create **live and on-demand** compositions, including highlights as events unfold
                - Use natural-language prompts to personalize **content, purpose, audience, length, and style**
                - Dynamically transform media for different experiences and formats, including **shot-by-shot 9:16 vertical video from 16:9 sources**
                - Represent compositions as references to **authoritative source media**, eliminating unnecessary derivative files
                - Generate outputs just in time for **streaming, embedding, sharing, download, personalization, and monetization**
                - Maintain **zero-copy, zero-movement workflows** with no unnecessary file copies, re-transcoding, intermediate storage, or egress
                
                The underlying composition, personalization, live highlights, and zero-copy generation capabilities are part of the Video Intelligence architecture described in the release.


            - title: Dynamic Vertical Video
              description: |
                - Automatically transform **16:9 live and on-demand video into 9:16 vertical presentations**
                - Live motion analysis and expert focus tracking
                - Per-player jersey identification
                - Shot-by-shot focal-point and crop-coordinate generation
                - Just-in-time vertical video through the Content Fabric media pipeline
                - No separate pre-encoded vertical stream or pre-generated vertical asset required

            - title: Private Ground Truth & Custom Intelligence
              description: |
                - Create and manage proprietary ground-truth datasets
                - Review and correct AI-generated results
                - Customer-specific identification of **players, speakers, celebrities, talent, brands, and other entities**
                - Deploy custom models against customer-labeled content
                - Tenant-isolated security and Content Fabric authorization
                - Continuously extend intelligence as models and customer data evolve

            - title: Zero-Copy, Zero-Movement AI
              description: |
                - AI models execute directly against authoritative Content Fabric media
                - **Zero file copies**
                - **Zero media or metadata movement**
                - **Zero unnecessary re-transcoding**
                - No separate AI media pipeline or secondary metadata alignment
                - AI outputs written directly into the Fabric
                - Intelligence immediately available for **search, personalization, generation, and delivery**

            - title: Agentic Video Intelligence
              description: |
                The **Eluvio MCP API** exposes major Content Fabric and Video Intelligence functions to LLMs, third-party applications, and AI agents, enabling complex video workflows through natural-language interfaces.

                - Invoke models and analyze video through natural-language workflows
                - Generate transcripts and update vector indices
                - Search video and identify precise key moments
                - Generate **chapters, summaries, synopses, and highlights**
                - Create clips, trailers, shorts, reels, and other compositions
                - Preserve Content Fabric authorization and owner-controlled permissions throughout agentic workflows
                - Maintain the same **zero-copy architecture** from AI analysis through finished media output

    media_wallet:
      header: Content Fabric Application Suite
      title: Eluvio Media Wallet
      short_description: |
        Universal personal media vault and player experience for TV and browser providing direct distribution of any premium video and bundled media from publisher to user.
      full_description: |
        The <span style="color: var(--color-highlight-3)">**Eluvio Media Wallet**</span> is a universal personal media vault and player experience for all major Connected TV platforms and browsers, and allows publishers to directly peer with audiences at scale to distribute premium content for all sell-through models - transactional ownership, subscription, and free/sponsored/ad-supported. Via the Media Wallet, audiences can discover, own, play and, if authorized, retrade in these experiences via seamless web3-style ownership, authorization and windowing. In addition to premium video, content can include bundled redeemable offers for merchandise and tickets, AR, 3D collectibles, exclusive artwork, bonus footage, soundtracks, images galleries, and more.
  
        The Media Wallet v2 expands upon the initial success of Media Wallet v1 by adding a new deep link API for embedding the wallet directly in browser and TV-based retailer properties, new features for embedding ebooks, documents, and multi-mode interactive experiences, and new platform versions including releases for Roku in addition to Apple tvOS, Android/Google TV, and Amazon Fire TV.
  
        The browser-based version includes a new generation UX that is fully integrated with the Creator Studio media and property management features. All versions are integrated with the Eluvio Authority Service APIs, which provide e-commerce checkout flows (credit card and web3 payments), and now support gifting of media in addition to purchase and free claim of media bundles. Media Wallet v2 APIs also integrate with 3rd party providers for seamless sign on to the wallet from 3rd party apps.
      accordion_sections:
        - header: Key Features
          items:
            - title: Universal Personal Media Vault and Player Experience for Connected TV and Browser
              description: |
                - Publishers directly distribute to users any content - premium video, live streams, redeemable offers and tickets, AR/3D collectibles, digital artwork, bonus video, images, and new interactive apps/ebooks/docs
                - Users discover, own, stream and trade in these experiences
                - High performance 4K streaming, tamper proof content storage, and blockchain backed ownership
                - Fabric policies validate ownership and enforce availability windows, geo restrictions, and other owner requirements
                - Now available for Apple tvOS, Android/Google TV, Amazon Fire TV and Roku (over 1600 devices supported)
            - title: New Browser UX for Creator Studio Properties
              description: |
                - New Browser UX fully integrated with Creator Studio properties.
                - Users can Discover, View, Purchase and Stream content from Properties directly within Media Wallet.
                - Includes the new Embeddable Player v2 with enhanced UX
            - title: Built-in Ecommerce Checkout and Payment
              description: |
                - Fully integrated with the Eluvio Authority Service APIs for ecommerce checkout flows (Stripe, PayPal, EBANX, and web3 payments)
                - New gifting in addition to purchase and free claim options
            - title: APIs for Retailer Integration
              description: |
                - New Deep Link API for embedding in TV/browser media retail apps
                - New APIs for purchase, entitlement and seamless sign on to the wallet from 3rd party apps
    embeddable_player:
      header: Content Fabric Application Suite
      title: Embeddable Player
      short_description: |
        Universal embeddable browser player for automatic authorization and streaming of any playable content type from a global URL on the Content Fabric.
      full_description: |
        The <span style="color: var(--color-highlight-3)">**Eluvio Embeddable Player**</span> is an open source embeddable player for automatic authorization and streaming of any playable or renderablhe content type (video, images, galleries, albums, etc). The player supports streaming playout from a universal URL on the Content Fabric and can be embedded as a standalone URL or iFrame on all major desktop and mobile browsers, or web-based Connected TV platforms. It supports live, catch-up live, on-demand streaming, multi-item playlists, subtitles, captions, and multi-audio switching.
        
        The player provides seamless support for all Fabric content security features: all authorization modes including OAuth, custom, or wallet authorization and ticket codes; secure per-session trustless encryption and DRM; and configurable fine-grained enforcement and revocation of authorization tokens via Fabric policy per source object/offering. The latest v2 version includes support for an ultra-low latency profile providing 3-4 second end-to-end playout latencies with standard HLS. It also has a new expanded UI with built-in indicators for live, on screen titles plus metadata, and configurable multi-view switching.
      accordion_sections:
        - header: Key Features
          items:
            - title: Universal Embeddable Player
              description: |
                - URL/iFrame embeddable player for streaming playout from a global
                - URL on the Content Fabric
                - Live, catch-up live, on-demand streaming
                - Start, pause, seek and rewind
                - Multi-item playlists
                - Multiple audio tracks, subtitles, and captions with dynamic selection
                - Automatically switches between portrait and landscape modes
                - New Ultra-low latency, low latency and standard profiles
                - New Configurable multi-view switching
                - New on screen and below player titles and expandable metadata
                - Also renders images, galleries and album types
            - title: Complete Fabric Security
              description: |
                - Authorization via OAuth, custom, wallet, and ticket codes
                - Secure per-session trustless encryption and DRM
                - Enforcement and revocation of authorization tokens via Fabric policy
            - title: All Major Browsers
              description: |
                - Chrome 39+ for Android
                - Chrome 39+ for Desktop
                - Firefox 41+ for Android
                - Firefox 42+ for Desktop
                - Edge for Windows 10+
                - Safari 9+ for macOS 10.11+
                - Safari for iPadOS 13+
                - Safari for iOS 17.1+
    fabric_core:
      header_title: Broadcast Transformation, D2C OTT Streaming & Monetization, Inline Video AI
      header_subtitle: Content Fabric - Bucharest Release
      header_video: hq__J8kACJ5CjKM3eBTyA44o6kHkVVh9T3NFp5bytgCA4EFyDeu6DD1vzVRtKPrKtayThpMcJPqZM1B
      summary_section:
        title: Any-to-Any Distribution. Maximum Quality. Unlimited AI Personalization & Monetization
        description: |
          Building on the <span style="color: var(--color-highlight-3)">**Content Fabric Bangkok Release**</span>, the <span style="color: var(--color-highlight-3)">**Bucharest Release**</span> advances Eluvio's decentralized, zero-copy architecture into a unified platform for <span style="color: var(--color-highlight-3)">**global broadcast distribution, premium D2C streaming, monetization, and inline AI video intelligence.**</span><br />
          The Content Fabric is established as a fundamentally different architecture for media: content, metadata, authorization, processing, and distribution operate directly on the Fabric rather than through chains of cloud storage, transcoding, origin, and CDN infrastructure. The <span style="color: var(--color-highlight-3)">**Bucharest Release builds on that foundation**</span>, extending the Fabric from streaming and media delivery into a comprehensive <span style="color: var(--color-highlight-3)">**any-to-any video distribution and intelligence platform**</span> spanning broadcast contribution and distribution, D2C OTT, Live-to-VoD, AI, personalization, monetization, and operations. <br />
          One ingest workflow can now simultaneously serve <span style="color: var(--color-highlight-3)">**B2B broadcast affiliates and millions of D2C viewers**</span>, replacing satellite, dedicated fiber, legacy media clouds, and CDN workflows with a unified architecture. The Bucharest Release delivers <span style="color: var(--color-highlight-3)">**sub-500ms global broadcast distribution, super-scale low-latency consumer streaming, progressive Live-to-VoD, premium next-generation audio and video, frame-accurate personalization, and AI-driven media creation**</span>—without duplicating the source media or building separate distribution stacks.


          The decentralized any-to-any architecture eliminates traffic duplication as distribution scales: <span style="color: var(--color-highlight-3)">**cost does not increase with receiver count and performance does not degrade as receiver count grows**</span>, with no egress fan-out charges, internal Fabric transit charges, or fees for unused distribution time.


          In the Bucharest Release, that same zero-copy architecture extends across the entire media lifecycle—from <span style="color: var(--color-highlight-3)">**live contribution and broadcast distribution through D2C streaming, recording, AI analysis, search, composition, advertising, personalization, rights, provenance, monetization, and end-to-end operations.**</span>
      upper_accordion_sections:
        - header: Features
          blocks:
            -
              pre_line: true
              description: |
                Reach broadcast affiliates worldwide through <span style="color: var(--color-highlight-3)">**sub-500ms MPEG-TS/SRT/RTP distribution with SMPTE 2022-7 decentralized multipath**</span>

                Stream to millions of D2C viewers over standard HLS/DASH

                <span style="color: var(--color-highlight-3)">**Deliver full-stack whitelabel OTT properties**</span> for <span style="color: var(--color-highlight-3)">**streaming**</span> and <span style="color: var(--color-highlight-3)">**archive monetization.**</span> Tap dark markets, with ease, premium quality, and profitability

                Progressively become VoD with <span style="color: var(--color-highlight-3)">**zero-copy recording, DVR, and instant replay**</span>

                Deliver premium <span style="color: var(--color-highlight-3)">**stereoscopic HFR 4K, MV-HEVC, Dolby Vision, Dolby Atmos, HDR/HDR10+, multi-audio, and multilingual**</span> experiences

                Feed inline, frame-accurate multimodal AI for <span style="color: var(--color-highlight-3)">**analysis, transcription, summarization, identification, tagging, and vector search**</span>

                Dynamically drive <span style="color: var(--color-highlight-3)">**clipping, composition, personalization, transformation, and delivery**</span>

                Generate personalized <span style="color: var(--color-highlight-3)">**highlights, trailers, reels, shorts, channels, and compositions**</span>

                Insert personalized advertising, content, graphics, watermarks, and <span style="color: var(--color-highlight-3)">**AI-driven virtual signage**</span> just in time, at scale, without copies and redistribution

                Support integrated <span style="color: var(--color-highlight-3)">**SVOD, TVOD, AVOD, entitlements, payments, rewards, and microtransactions**</span>

                Enforce authorization, DRM, forensic watermarking, rights, and <span style="color: var(--color-highlight-3)">**C2PA-backed content provenance**</span>

                Provide unified operational control, QoS, audience, and revenue intelligence across B2B and D2C distribution

      zero_copy_section:
        title: Zero-Copy Architecture Across the Entire Workflow
        description: |
          The defining advantage of the <span style="color: var(--color-highlight-3)">**Content Fabric — Bucharest Release**</span> is that these capabilities operate against the <span style="color: var(--color-highlight-3)">**same authoritative media and metadata.**</span>

          <span style="color: var(--color-highlight-3)">**Ingest once. Distribute anywhere. Record once. Reuse everywhere.**</span>

          Live broadcast distribution, D2C streaming, progressive Live-to-VoD, DVR, premium <span style="color: var(--color-highlight-3)">**MV-HEVC/HFR 4K and Dolby**</span> experiences, AI analysis and search, highlights and compositions, dynamic advertising, graphics, virtual signage, monetization, provenance, and analytics all operate within the same Content Fabric architecture.

          That means fewer separate pipelines, fewer derivative files, less unnecessary transcoding and movement, and no need to repeatedly export media between broadcast, cloud, CDN, AI, and OTT systems—the architectural foundation behind the Fabric's combination of <span style="color: var(--color-highlight-3)">**scale, low latency, personalization, media reuse, and dramatically improved infrastructure economics.**</span>

      accordion_sections:
        - header: Streaming & Distribution — Performance and Scale
          items:
            - title: Super-scale low-latency global live streaming to millions
              description: |
                - Deterministic <span style="color: var(--color-highlight-3)">**3-4 second glass-to-glass live streaming**</span> using standard CMAF HLS/DASH
                - <span style="color: var(--color-highlight-3)">**≤1 second segment delivery times for 99% of clients and segments**</span>
                - Standard HLS/DASH ABR — <span style="color: var(--color-highlight-3)">**no custom player required**</span>
                - Performance holds at scale and is independent of client location
                - Premium encrypted streaming with integrated DRM, authorization, DVR, multi-audio, multi-view, and casting
                - Up to <span style="color: var(--color-highlight-3)">**10X lower cost**</span> than traditional CDN and media-cloud infrastructure at scale
                - Bucharest Release performance enhancements include <span style="color: var(--color-highlight-3)">**≤30ms segment delivery latency, 8X increased live cross-variant serving, up to 4X DRM encryption variant scale, zero-impact global maintenance, and instant-on HFR streaming**</span>
            - title: Ultra-low-latency global MPEG-TS / SRT / RTP broadcast distribution
              description: |
                - <span style="color: var(--color-highlight-3)">**Sub-500ms global latency**</span>
                - <span style="color: var(--color-highlight-3)">**Sub-millisecond jitter**</span>
                - <span style="color: var(--color-highlight-3)">**SMPTE 2022-7 decentralized multipath**</span> with phase-lock synchronization
                - Fast global stream switching and failover
                - Decentralized any-to-any routing
                - Replace satellite, dedicated fiber, and ground-to-cloud multipoint distribution
                - Cost does not increase and performance does not degrade as receiver count grows
                - <span style="color: var(--color-highlight-3)">**No egress fan-out charges, internal Fabric transit charges, or fees for unused distribution time**</span>
            - title: Flexible live contribution and ingest
              description: |
                - SRT, MPEG-TS/UDP, and RTP
                - RTMP ingest
                - <span style="color: var(--color-highlight-3)">**JPEG XS and AVC/HEVC over UDP/RTP/SRT**</span>
                - Ingest directly from cameras, encoders, broadcast trucks, venues, or remote locations
                - SRT contribution for wide-area contribution and remote production

        - header: Advanced Video & Audio
          items:
            - title: Premium next-generation video
              description: |
                - <span style="color: var(--color-highlight-3)">**Stereoscopic HFR 4K**</span>
                - Side-by-Side (<span style="color: var(--color-highlight-3)">**SBS**</span>) stereoscopic video
                - <span style="color: var(--color-highlight-3)">**MV-HEVC**</span>
                - <span style="color: var(--color-highlight-3)">**Dolby Vision**</span>
                - HDR and HDR10+
                - High Frame Rate (HFR) with instant-on streaming
                - AVC and HEVC
                - <span style="color: var(--color-highlight-3)">**AV1 upcoming**</span>
            - title: Advanced audio and language support
              description: |
                - <span style="color: var(--color-highlight-3)">**Dolby Atmos**</span>
                - Multiple audio streams in live and VoD
                - Multiple languages, dubs, and audio variants within a single playout
                - Optimized Content Fabric asset architecture supporting <span style="color: var(--color-highlight-3)">**hundreds of audio-language and subtitle tracks**</span>
                - Preserve complex audio, video, subtitle, and language combinations throughout live, VoD, archive, and D2C distribution
            - title: Fast startup for giant VoD objects
              description: |
                - Fabric metadata optimizations enable premium VoD objects containing large numbers of variants to start streaming immediately
                - Designed for titles with combinations such as <span style="color: var(--color-highlight-3)">**100+ audio languages**</span>
                - Efficient handling of hundreds of language and subtitle tracks without replicating the underlying media

        - header: Progressive Live-to-VoD, DVR & Recording
          items:
            - title: Automatic Digital Video Recording (DVR) of live streams with zero-copy overhead
              description: |
                - Automatically record live streams using already-published live parts
                - <span style="color: var(--color-highlight-3)">**No file copies**</span>
                - Instant and progressive conversion of live streams to VoD
                - Configurable by timecode or SCTE signal
                - Fast catch-up DVR and instant replay
            - title: Progressive Live-to-VoD
              description: |
                - Access ongoing recordings while the event is still live
                - Immediately apply <span style="color: var(--color-highlight-3)">**AI tagging, transcription, summarization, clipping, search, and highlight generation**</span>
                - Generate derivative content without waiting for completion of the live program
                - Reuse the authoritative live media parts for VoD and derivative experiences
                - No unnecessary export, movement, storage, or re-transcoding

        - header: End-to-end Security, DRM & Built-in Rights Control/Geo Fencing
          items:
            - title: Built-in content protection
              description: |
                - Multi-layer AES encryption
                - Proxy re-encryption into per-session key spaces
                - Per-session authorization
                - Multi-DRM for D2C
                - SRT encryption for B2B distribution
                - <span style="color: var(--color-highlight-3)">**Google Widevine, Apple FairPlay, and Microsoft PlayReady**</span>
                - Full Widevine parameterization
            - title: Advanced authorization and Built in Rights/Geofencing
              description: |
                - Geographic restrictions
                - Availability windows
                - ACLs
                - Entitlements
                - Personalized access policies
                - Consistent authorization across B2B SRT/TS and D2C HLS/DASH endpoints

        - header: Forensic Watermarking for Live and VoD
          header_as_title: true
          description: |
            - Per-session forensic watermarking
            - <span style="color: var(--color-highlight-3)">**NAGRA NexGuard A/B sequence integration**</span>
            - Fabric Just-in-Time transcoding and playout
            - Forensic watermarking for live streaming, VoD, clips, and short-duration streams
            - Personalized watermarking without requiring pre-generated media variants

        - header: Content & Ad Insertion, Personalization and Graphics Enrichment
          items:
            - title: Frame-Accurate Dynamic Content Insertion in Live and VoD Streams (FAST)
              description: |
                - Fast just-in-time transcoding and insertion of ads and content
                - <span style="color: var(--color-highlight-3)">**Dynamic Content Selector API**</span> executes custom bitcode/business logic in-Fabric
                - Integrate third-party ad services and proxies
                - Server-side, fine-grained, personalized insertion
                - No pre-transcoding of personalized variants
                - Controller API triggers insertion using <span style="color: var(--color-highlight-3)">**SCTE markers or on-cue events**</span>
            - title: Native In-Fabric SSAI
              description: |
                - Server-side ad insertion integrated directly into the distribution pipeline
                - Unlimited per-session personalization
                - Frame-accurate dynamic insertion
                - VAST ad server integration
                - No separate media-processing pipeline required
            - title: Dynamic Content Enrichment
              description: |
                - Inline with the Fabric JIT video pipeline
                - Dynamic representation implemented in <span style="color: var(--color-highlight-3)">**WASM bitcode**</span>
                - Generate images, text, graphics, and visible watermarks from HTML
                - Parameterize by <span style="color: var(--color-highlight-3)">**user, content, audience, or offering**</span>
                - Personalized watermarks
                - Client side In This Video and Overlays / Smart Experiences
            - title: AI-Personalized Vertical Video / Virtual Signage
              description: |
                - Frame-accurate AI inference and metadata applied to source feeds
                - Per-frame rendering of <span style="color: var(--color-highlight-3)">**virtual signage and smart transformations**</span>
                - Generate targeted broadcast TS or consumer streaming output just in time
                - Personalize signage by viewer or audience group
                - Source feed analyzed once
                - Distribution requirements remain constant regardless of the number of personalized variants
                - No player modification or duplicate distribution required

        - header: AI-Generated Highlights, Channels & Compositions
          header_as_title: true
          description: |
            - Generate personalized <span style="color: var(--color-highlight-3)">**highlights, clips, trailers, reels, shorts, channels, and compositions**</span>
            - Create outputs directly from live recorded parts or VoD
            - AI-generated candidate identification with human review and editing
            - Combine AI intelligence with <span style="color: var(--color-highlight-3)">**play-by-play, player/ball tracking, transcripts, identities, audio, scenes, events, and other metadata**</span>
            - Dynamically drive <span style="color: var(--color-highlight-3)">**clipping, composition, personalization, transformation, and delivery**</span>
            - Generate live highlights as events unfold
            - Generate personalized outputs just in time without pre-creating derivative files
            - Browse, edit, publish, and share zero-copy clips and compositions through <span style="color: var(--color-highlight-3)">**EVIE**</span>
            - Stream or publish compositions without file copies, exports, or egress

        - header: Universal AI Content Tagging, Intelligence & Search
          items:
            - title: Inline multimodal AI inference
              description: |
                - High-accuracy automatic labeling, description, transcription, identification, segmentation, and summarization
                - AI operates directly against Fabric video with <span style="color: var(--color-highlight-3)">**zero file movement**</span>
                - Frame- and segment-level inference across live and VoD
                - Video, audio, image, text, motion, pose, and metadata intelligence
                - AI outputs recorded directly into Content Object metadata
                - Intelligence automatically indexed and immediately actionable within Fabric streaming workflows
            - title: Open-model AI Runtime
              description: |
                - Eluvio built-in AI models and processors
                - Open-source models
                - Customer-specific and third-party models
                - Create and integrate <span style="color: var(--color-highlight-3)">**fine-tuned and domain-specific models**</span>
                - Extend face, player, celebrity, and logo ground-truth pools without model retraining
                - New and expanded models for:
                  - Per-frame video description
                  - Whole-content summaries and synopses
                  - Face and celebrity detection
                  - Player identification
                  - Logo and brand recognition
                  - Landmark recognition
                  - OCR
                  - Shot/beat/scene boundary detection
                  - Motion, focus, and pose analysis
                  - Multilingual speech-to-text and speaker intelligence
            - title: Eluvio AI Vector Search
              description: |
                - State-of-the-art multimodal vector search
                - Combine AI/ML intelligence with <span style="color: var(--color-highlight-3)">**third-party tags and metadata**</span>
                - Natural-language, keyword, semantic, image, audio, transcript, metadata, and visual-region search
                - Search down to precise <span style="color: var(--color-highlight-3)">**frames, shots, scenes, moments, and clips**</span>
                - Fast indexing engine re-crawls Content Object metadata in seconds
                - Configure which content is indexed
                - Clip Search API returns matching clips with <span style="color: var(--color-highlight-3)">**dynamic JIT playout from the authoritative source object**</span>
                - No manual cutting, file transfer, export, or egress
            - title: Eluvio Video Intelligence Editor (EVIE)
              description: |
                - Search and inspect synchronized AI intelligence
                - Review and correct AI results and ground truth
                - Edit AI-suggested highlight candidates
                - Frame-accurate clipping and composition
                - Publish and share clips and compositions
                - Integrated directly with Fabric live and VoD media
                
                
                The Bucharest architecture extends AI directly into the media platform, providing inline, frame-accurate multimodal inference for live and VoD without file copying, file movement, or unnecessary transcoding.

        - header: Management, QoS & End-to-End Monitoring
          items:
            - title: Enhanced Live Stream Manager
              description: |
                - Automatically probes input sources
                - Automatically configures streaming parameters
                - Reconfigures live-stream playout parameters and watermarks with soft reset
