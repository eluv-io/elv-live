  pages:
    video_editor:
      header: Content Fabric Application Suite
      title: Eluvio Video Intelligence Editor
      walkthrough_video: hq__27P5hS3frW3LXDFMzQsX4jyauiZ7BxM4rKZi3EhPcjPLL8H93YHzShYbDAkGHtnXasy6PoDT1tZC
      short_description: |
        is a next-generation AI video intelligence, search, editing, and composition environment built natively on the Eluvio Content Fabric. EVIE brings video, audio, metadata, and multimodal AI intelligence together in a single, media-synchronized browser workspace, enabling users to view, analyze, search, validate, clip, edit, and transform live and on-demand video with frame accuracy.
      full_description: |
        <span style="color: var(--color-text-light-3); fontWeight: 600; marginBottom: 50px; fontSize: var(--font-size-header-3)">Frame-Accurate Video, Metadata, and Intelligence</span>

        EVIE provides frame-accurate timeline viewing and scrubbing for any playable Content Fabric media and its associated metadata, directly in the browser. Through <span style="color: var(--color-highlight-3)">**EVIE Titles & Events**</span>, users can work with the complete intelligence associated with a film, television program, live event, or sports match—including transcripts, speakers, players and celebrities, objects and brands, OCR, motion and pose, topics, moods, themes, shots, beats, scenes, telemetry, embeddings, highlights, and other AI-generated or externally supplied metadata.
        
        AI and metadata results are visualized as synchronized tracks directly against the media timeline at the frame, shot, beat, scene, segment, title, and event level. This includes intelligence generated by Eluvio AI services as well as third-party metadata—such as sports play-by-play data, timing and telemetry feeds, and custom editorial curation—which can be posted via API and automatically integrated into EVIE for visualization, search, clipping, and composition.

        <span style="color: var(--color-text-light-3); fontWeight: 600; marginBottom: 50px; fontSize: var(--font-size-header-3)">Integrated AI Runtime and Multimodal Search</span>
        
        EVIE’s integrated <span style="color: var(--color-highlight-3)">**AI Runtime**</span> allows users to select, run, and manage Eluvio, open-source, customer-specific, and third-party AI models directly against Content Fabric media. AI capabilities can include speech-to-text, speaker identification, celebrity and player recognition, OCR, object and brand detection, visual analysis, summarization, highlights, and other customer- or content-specific models.
        
        Deep multimodal search enables users to search across individual titles, events, or entire video libraries using natural language, images, text, music, metadata, AI-generated intelligence, and selected visual regions to locate precise moments, shots, scenes, clips, or individual frames.

        <span style="color: var(--color-text-light-3); fontWeight: 600; marginBottom: 50px; fontSize: var(--font-size-header-3)">Frame-Accurate Clipping, Editing, and Composition</span>
        
        EVIE turns intelligence directly into media. Users can perform seamless, in-place clip creation using frame-accurate mark-in/mark-out controls, save key frames, and dynamically generate and share clips—all without creating source-file copies, performing unnecessary re-transcodes, or moving media out of the Fabric.
        
        Clips can be created from both VoD assets and <span style="color: var(--color-highlight-3)">**in-progress live streams**</span>, with in/out points selected manually or automatically from AI/ML-generated tags, highlights, play-by-play data, or other synchronized metadata. Finished clips and compositions can be shared through configurable streaming or download links.
        
        Beyond individual clips, EVIE can create personalized highlights, chapters, trailers, shorts, social clips, compliance reels, and other compositions directly from the source media and intelligence.
        
        For live sports and other dynamic content, EVIE can automatically identify focal points and generate shot-by-shot <span style="color: var(--color-highlight-3)">**9:16 vertical video from 16:9 sources**</span> through the Content Fabric’s just-in-time media pipeline.
        
        <span style="color: var(--color-text-light-3); fontWeight: 600; marginBottom: 50px; fontSize: var(--font-size-header-3)">Content-Native, Zero-Copy Media Workflows</span>
        
        Unlike conventional AI video workflows, EVIE operates directly against the <span style="color: var(--color-highlight-3)">**authoritative Content Fabric media**</span>. The Fabric’s content-native architecture—combining component-based media, object metadata, and just-in-time processing—allows media and intelligence operations to occur directly against the source content object.
        
        Users can instantly record live streams, convert live content to VoD, apply AI analysis and tagging, generate highlights, search and retrieve moments, create clips and compositions, personalize outputs, and deliver finished media <span style="color: var(--color-highlight-3)">**without moving or duplicating the underlying source files**</span>.
        
        AI inference, metadata, search, editing, composition, personalization, and delivery remain synchronized to the source—with <span style="color: var(--color-highlight-3)">**zero file copies, zero unnecessary media or metadata movement, and zero unnecessary re-transcoding or egress**</span>.
        
        This eliminates the conventional workflow of moving large media files between storage, AI processing, editing, rendering, and distribution systems, enabling substantially faster and more efficient workflows from live ingest and AI analysis through finished media delivery.
        
        <span style="color: var(--color-text-light-3); fontWeight: 600; marginBottom: 50px; fontSize: var(--font-size-header-3)">AI Validation and Ground-Truth Data</span>
        
        EVIE also provides tools for reviewing, validating, and correcting AI results and managing private ground-truth datasets. Media organizations can use their own corrections, proprietary metadata, talent and speaker information, player data, and other domain-specific intelligence to continuously improve AI results for their content.
        
        This creates a unified environment in which human editorial expertise, proprietary data, and machine intelligence can work together against the same authoritative media.
        
        <span style="color: var(--color-text-light-3); fontWeight: 600; marginBottom: 50px; fontSize: var(--font-size-header-3)">Agentic Video Workflows with the Eluvio MCP API</span>
        
        With the new <span style="color: var(--color-highlight-3)">**Eluvio MCP API**</span>, EVIE and major Content Fabric AI functions can also be orchestrated by LLMs and AI agents.
        
        Using natural-language instructions, agents can analyze content, search across video libraries, run AI models, generate transcripts and chapters, identify people and objects, locate key moments, create highlights and clips, and produce finished video compositions.
        
        These agentic workflows operate through the same Content Fabric authorization and content-native architecture as EVIE itself—preserving access controls and maintaining the Fabric’s <span style="color: var(--color-highlight-3)">**zero-copy approach from source media and intelligence through finished video output**</span>.




      accordion_sections:
        - header: Key Features
          items:
            - title: Create and Share Clips from any Fabric Content ‘in place’ - No Intermediary File Copies, Re-transcodes, or Egress
              description: |
                - Clip from in-progress live streams
                - Set clip in/out points manually, by searching through tags or highlight cue points
                - Share to individual users with integrated email notification and configurable expiration on streaming or download links
                - Choose the audio and offerings to be shared, e.g. watermarked, specific overlays
                - Post public clip URLs to social
            - title: Search and Curate Multi-modal AI Tag Tracks (Eluvio AI and User Added)
              description: |
                - Browse, search, and filter frame-level, segment-level, and section-level tags created by the Eluvio Multi-modal AI Tagging and Summarization Service
                - Our models include vision, text, and large learning: Celebrity Detection, Logo Detection, Landmark Detection, OCR, Speech-to-Text Transcription, Music Detection, Generative Shot Descriptions (LLAVA), Generative Image Descriptions (GIT), and Custom fine-tuned models.
                - Per section models include Topics, Summaries, Highlights and Captions
                - View tags aggregated by shot boundary.
                - POST 3rd party tags such as play-by-play sports data feeds and customer curated metadata to any Fabric playable object via the API. Custom tag tracks are automatically added to the EVIE for browsing, filtering and search.
                - Add new bounding box and segment level tags and save to private tenant-specific ground truth.
                - Add custom tagging points for clipping and composition creation
            - title: Create Personalized Compositions – Highlights, Linear Channels, and Playlists – Using AI Suggestions or From Scratch, Distribute and Share “In Place” - No Intermediary File Copies, Re-transcodes, or Egress
              description: |
                - Use the AI-Assisted pathway to automatically generate a Highlight (“Match in 15”) with optional personalization prompts such as for team or player. 
                - Powered by the Eluvio AI Stack, the pipeline runs inline the Content Fabric to select relevant clips from the source video, and returns the best candidates on an individual timeline track.
                - How does it work?  The pipeline leverages a fine-tuned inline LLM we have trained on real-world highlights to generate content-specific search queries targeting exciting moments.  We use the Eluvio AI Search to generate candidate clips from these queries.
                - The LLM acts as a ‘judge’ to select the best clips for the final composition and uses the timestamps to crop out the most relevant sections to achieve the desired length for the final composition.
                - Edit the suggested clips including adjusting start and endpoints, inserting and removing suggested candidates, and searching for replacements via the integrated multi-modal Eluvio AI Search.
                - Eluvio AI Search creates a high accuracy, multi-modal vectorized embedding from the AI-generated and user-provided tags describing the content and supports keyword and semantic queries to return relevant clips.
                - Also create your own Composition from scratch by creating clips within your playable content objects and adding them to the timeline
                - Or by using the integrated AI Search to select relevant clips from your content
                - Publish your Compositions to the Fabric for Just-in-Time Streaming Globally
                - Share your Compositions via the built in Sharing capability for individuals or Post to Social.
                - Create any new version without ever moving, exporting, or re-transcoding the original video file, or ingesting the new highlight file.
                - Create any personalized version just-in-time from the source video with no file copies or duplication.
            - title: Curate Image Assets and Manage Ground Truth with Privacy and Provenance
              description: |
                - Search and view any authorized image assets within your tenancy
                - Review and edit AI generated or manual tags.
                - Browse, search, and filter frame-level and summarization results:  Celebrity Detection, Logo Detection, Landmark Detection, OCR, Generative Image Descriptions (LLAVA, GIT), and Custom fine-tuned LVLM models such as Custom Caption generation with support for Human-in-the-loop.
                - Browse images in the Eluvio AI ground truth pools, and add images to your custom ground truth pools
                - Manage ground truth pools securely and privately within your own tenancy for complete provenance control on your content AI.

